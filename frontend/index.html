<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Simple 3-Tier Demo</title>
  <style>
    body { font-family: Arial, sans-serif; margin: 30px; }
    input { padding: 8px; width: 300px; }
    button { padding: 8px 12px; }
    ul { margin-top: 20px; }
    li { margin: 6px 0; }
    .meta { color: #666; font-size: 12px; margin-left: 8px; }
  </style>
</head>
<body>
  <h2><!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Jenkins Demo App</title>
  <style>
    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: linear-gradient(135deg, #0f172a, #1e293b);
      color: white;
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100vh;
    }
    .card {
      background: rgba(255, 255, 255, 0.1);
      padding: 40px;
      border-radius: 16px;
      text-align: center;
      box-shadow: 0 8px 20px rgba(0,0,0,0.3);
    }
    h1 {
      margin-bottom: 10px;
      color: #38bdf8;
    }
    p {
      margin: 8px 0;
      font-size: 18px;
    }
    .tag {
      margin-top: 15px;
      display: inline-block;
      padding: 8px 14px;
      background: #22c55e;
      color: #0f172a;
      border-radius: 999px;
      font-weight: bold;
    }
  </style>
</head>
<body>
  <div class="card">
    <h1>Hello from Jenkins CI/CD</h1>
    <p>This application was deployed using Jenkins.</p>
    <p>Welcome to your simple HTML deployment demo.</p>
    <span class="tag">Build Success</span>
  </div>
</body>
</html></h2>

  <input id="msg" placeholder="Type something..." />
  <button onclick="save()">Save</button>

  <h3>Saved Messages</h3>
  <ul id="list"></ul>

  <script>
    async function load() {
      const res = await fetch("/api/messages");
      const data = await res.json();
      const list = document.getElementById("list");
      list.innerHTML = "";
      data.forEach(r => {
        const li = document.createElement("li");
        li.textContent = r.content;
        const span = document.createElement("span");
        span.className = "meta";
        span.textContent = `(#${r.id} @ ${r.created_at})`;
        li.appendChild(span);
        list.appendChild(li);
      });
    }

    async function save() {
      const input = document.getElementById("msg");
      const content = input.value.trim();
      if (!content) return;

      await fetch("/api/messages", {
        method: "POST",
        headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ content })
      });

      input.value = "";
      load();
    }

    load();
  </script>
</body>
</html>
